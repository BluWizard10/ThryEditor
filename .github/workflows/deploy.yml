name: Build VCC Package Release

# Push a tag to cut a release, e.g.:
#   git tag 2.71.4        (or v2.71.4 — the leading "v" is stripped)
#   git push origin 2.71.4
#
# The tag is the single source of truth for the version. This workflow stamps the
# tag's version verbatim into package.json ("version") and Editor/Config.cs
# (INSTALLED_VERSION), commits that back to master, re-points the tag at the stamped
# commit, then publishes a GitHub Release with the VPM zip + package.json attached.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write # commit to master, force-move the tag, and create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
        # Check out the branch (not the detached tag) so the stamped commit lands on master.
        - name: Checkout master
          uses: actions/checkout@v4
          with:
            ref: master
            fetch-depth: 0
            
        - name: Derive version from tag
          run: |
            set -euo pipefail
            VERSION="${GITHUB_REF_NAME#v}"   # strip an optional leading "v"
            # Accept X.Y.Z optionally followed by a -prerelease and/or +build suffix.
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
              echo "::error::Tag '$GITHUB_REF_NAME' does not look like a valid version (expected X.Y.Z)."
              exit 1
            fi
            PACKAGE_NAME="$(jq -r '.name' package.json)"
            {
              echo "VERSION=$VERSION"
              echo "PACKAGE_NAME=$PACKAGE_NAME"
              echo "ZIP_NAME=$ZIP_NAME"
            } >> "$GITHUB_ENV"
            echo "Releasing $PACKAGE_NAME version $VERSION -> $ZIP_NAME"

        - name: Stamp version into package.json and Config.cs
          run: |
            set -euo pipefail
            sed -i -E 's/("version"[[:space:]]*:[[:space:]]*")[^"]*(")/\1'"$VERSION"'\2/' package.json
            sed -i -E 's/(INSTALLED_VERSION[[:space:]]*=[[:space:]]*")[^"]*(")/\1'"$VERSION"'\2/' Editor/Config.cs
            echo "package.json -> $(grep '"version"' package.json)"
            echo "Config.cs    -> $(grep 'INSTALLED_VERSION' Editor/Config.cs | head -n1)"
            # Fail loudly if either stamp did not take.
            grep -q "\"version\": \"$VERSION\"" package.json
            grep -q "INSTALLED_VERSION = \"$VERSION\"" Editor/Config.cs
        
        # Commit the stamped files to master and move the tag to the new commit.
        # Pushes made with the built-in GITHUB_TOKEN do NOT trigger a new workflow run,
        # so force-moving the tag here will not re-fire this workflow (no loop guard needed).
        - name: Commit stamped files and re-point tag
          run: |
            set -euo pipefail
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json Editor/Config.cs
            if git diff --cached --quiet; then
              echo "No version changes to commit (already stamped)."
            else
              git commit -m "Release $VERSION"
              git push origin master
              git tag -f "$GITHUB_REF_NAME"
              git push -f origin "refs/tags/$GITHUB_REF_NAME"
            fi
        
        # package.json sits at the repo root, so zipping "." puts it at the zip root (VCC requirement).
        - name: Build VPM Package Zip
          run: |
            set -euo pipefail
            zip -r "$ZIP_NAME" . -x '.git/*' -x '.github/*' -x '.claude/*' -x '*.zip'
            echo "Built $ZIP_NAME"
        
        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            name: ${{ github.ref_name }}
            generate_release_notes: true
            files: |
              ${{ env.ZIP_NAME }}
              package.json
        
        - name: Dispatch to VPM Listing
          uses: peter-evans/repository-dispatch@v3
          with:
            token: ${{ secrets.VPM_LISTING_DISPATCH_TOKEN }}
            repository: poiyomi/vpm
            event-type: rebuild-listing